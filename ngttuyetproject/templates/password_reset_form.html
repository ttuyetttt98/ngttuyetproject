{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-5" style="max-width: 600px;">
    
    <div class="card p-4 shadow-sm bg-white">

        <h3 class="fw-bold text-center mb-3">新しいパスワードを入力してください</h3>

        <p class="text-muted mb-4">
            新しいパスワードを2回入力してください。<br>
            同じパスワードを入力することで確認が行われます。
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                {{ form }}
            </div>

            <button type="submit" class="btn btn-success fw-bold w-100">
                パスワードをリセットする
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'accounts:home' %}" class="text-secondary">
                トップページに戻る
            </a>
        </div>

    </div>
</div>

{% endblock %}
