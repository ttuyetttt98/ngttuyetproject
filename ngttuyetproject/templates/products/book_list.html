{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container mt-4">

    <!-- Tiêu đề -->
    <h2 class="mb-4">📚 本の一覧（中古本）</h2>

    <div class="row">

        {% for book in books %}
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm h-100">

                <!-- Hình ảnh sách -->
                {% if book.image %}
                    <img src="{{ book.image.url }}" class="card-img-top" alt="{{ book.title }}">
                {% else %}
                    <img src="{% static 'img/no_image.png' %}" class="card-img-top" alt="No Image">
                {% endif %}

                <div class="card-body">
                    <h5 class="card-title" style="font-size: 1rem; height: 48px; overflow: hidden;">
                        {{ book.title }}
                    </h5>

                    <p class="card-text text-muted" style="font-size: 0.9rem;">
                        {{ book.author }}
                    </p>

                    <!-- Giá -->
                    {% if book.price %}
                    <p class="fw-bold text-danger">{{ book.price }} 円</p>
                    {% endif %}

                    <!-- Nút chi tiết -->
                    <a href="{% url 'products:book_detail' book.id %}"
                       class="btn btn-primary btn-sm w-100">
                        詳細を見る
                    </a>

                </div>
            </div>
        </div>
        {% empty %}
        <p>まだ登録された本がありません。</p>
        {% endfor %}

    </div>
</div>

{% endblock %}
